<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI 2050 - Ultimate Creator Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #02030A;
            --neon-cyan: #00E5FF;
            --electric-purple: #8A2EFF;
            --text-main: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(0, 229, 255, 0.2);
            --panel-bg: rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(138, 46, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.15), transparent 25%);
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: transparent url('https://cdn.pixabay.com/photo/2016/01/27/15/25/space-1164579_960_720.png') repeat top center;
            animation: move-stars 200s linear infinite; opacity: 0.3;
        }
        @keyframes move-stars { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }

        .header { text-align: center; margin-top: 30px; z-index: 10; cursor: pointer; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px var(--neon-cyan); }
        .header p { font-size: 10px; color: var(--electric-purple); letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        .view-panel { display: none; width: 95%; max-width: 600px; margin-top: 20px; z-index: 10; animation: fadeIn 0.4s ease-out; padding-bottom: 100px; }
        .view-panel.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard Styles */
        .orb-container { position: relative; width: 160px; height: 160px; margin: 20px auto; display: flex; justify-content: center; align-items: center; }
        .core-orb { width: 60px; height: 60px; background: radial-gradient(circle, #fff, var(--neon-cyan)); border-radius: 50%; box-shadow: 0 0 40px var(--neon-cyan); animation: pulse 3s infinite alternate; }
        .ring { position: absolute; width: 140px; height: 140px; border-radius: 50%; border-top: 2px solid var(--neon-cyan); border-bottom: 2px solid var(--electric-purple); animation: spin 4s linear infinite; }
        .ring-2 { width: 180px; height: 180px; border-radius: 50%; border-left: 2px solid var(--neon-cyan); border-right: 2px solid var(--electric-purple); animation: spin-reverse 6s linear infinite; }
        @keyframes pulse { 100% { transform: scale(1.1); box-shadow: 0 0 60px var(--neon-cyan), 0 0 100px var(--electric-purple); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .holo-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .holo-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); transform: translateY(-3px); }
        .holo-card h3 { font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--neon-cyan); margin-bottom: 5px; }
        .holo-card p { font-size: 10px; color: rgba(255, 255, 255, 0.6); }

        .tool-box { width: 100%; background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid var(--electric-purple); border-radius: 15px; padding: 25px; box-shadow: 0 0 30px rgba(138, 46, 255, 0.1); }
        .tool-header { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        
        .input-dark { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(0,229,255,0.3); border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 15px; font-family: 'Inter', sans-serif; outline: none; transition: 0.3s; }
        .input-dark:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        
        .btn-primary { width: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--electric-purple)); border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(138, 46, 255, 0.5); transform: scale(1.02); }

        .result-box { margin-top: 15px; text-align: center; width: 100%; }
        .result-box img { width: 100%; border-radius: 10px; border: 1px solid var(--neon-cyan); display: none; }

        .dock { position: fixed; bottom: 20px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 30px; padding: 10px 25px; display: flex; gap: 40px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .dock-item { color: rgba(255, 255, 255, 0.4); font-size: 18px; text-align: center; cursor: pointer; transition: 0.3s; }
        .dock-item.active, .dock-item:hover { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); transform: translateY(-3px); }
        .dock-item span { display: block; font-size: 9px; margin-top: 4px; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="header" onclick="navigate('home')">
        <h1>NOVA AI</h1>
        <p>Live Real Engine</p>
    </div>

    <div id="home" class="view-panel active">
        <div class="orb-container">
            <div class="core-orb"></div>
            <div class="ring"></div>
            <div class="ring-2"></div>
        </div>
        <div class="features-grid">
            <div class="holo-card" onclick="navigate('voice')">
                <h3>🎙️ AI VOICE (LIVE)</h3><p>Real Text-to-Speech</p>
            </div>
            <div class="holo-card" onclick="navigate('thumbnail')">
                <h3>🎨 THUMBNAIL (LIVE)</h3><p>Real Image Generation</p>
            </div>
            <div class="holo-card" onclick="alert('Iske liye Node.js Backend lagega bhai. Sirf HTML se nahi hoga.')">
                <h3>🎬 AI STUDIO</h3><p>Requires Backend</p>
            </div>
            <div class="holo-card" onclick="alert('Iske liye Node.js Backend lagega bhai. Sirf HTML se nahi hoga.')">
                <h3>⚡ EXTRACTOR</h3><p>Requires Backend</p>
            </div>
        </div>
    </div>

    <div id="voice" class="view-panel">
        <div class="tool-box">
            <div class="tool-header">🎙️ REAL VOICE SYNTHESIS</div>
            <textarea id="tts-input" class="input-dark" rows="4" placeholder="Type anything here and the AI will speak it aloud..."></textarea>
            <button class="btn-primary" onclick="speakRealVoice()">SPEAK NOW 🔊</button>
        </div>
    </div>

    <div id="thumbnail" class="view-panel">
        <div class="tool-box">
            <div class="tool-header">🎨 REAL AI GENERATOR</div>
            <input type="text" id="img-prompt" class="input-dark" placeholder="E.g., A futuristic racing car in neon city...">
            <button class="btn-primary" id="img-btn" onclick="generateRealImage()">GENERATE ART 🖼️</button>
            <div class="result-box" id="img-result">
                <p id="img-loading" style="color:var(--neon-cyan); display:none; font-size:12px;">Generating from Cloud API (Wait 5 sec)...</p>
                <img id="generated-img" src="" alt="AI Output">
            </div>
        </div>
    </div>

    <div class="dock">
        <div class="dock-item active" onclick="navigate('home')">⌂<span>HOME</span></div>
        <div class="dock-item" onclick="navigate('voice')">🎙️<span>VOICE</span></div>
        <div class="dock-item" onclick="navigate('thumbnail')">🎨<span>ART</span></div>
    </div>

    <script>
        // Router
        function navigate(pageId) {
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.querySelectorAll('.dock-item').forEach(item => item.classList.remove('active'));
            if(pageId === 'home') document.querySelectorAll('.dock-item')[0].classList.add('active');
            if(pageId === 'voice') document.querySelectorAll('.dock-item')[1].classList.add('active');
            if(pageId === 'thumbnail') document.querySelectorAll('.dock-item')[2].classList.add('active');
        }

        // REAL WORKING TTS (Browser Built-in Engine)
        function speakRealVoice() {
            const text = document.getElementById('tts-input').value;
            if(!text) { alert("Bhai, kuch type toh karo!"); return; }
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // REAL WORKING AI IMAGE (Using Free Pollinations API)
        function generateRealImage() {
            const prompt = document.getElementById('img-prompt').value;
            if(!prompt) { alert("Bhai, prompt likho!"); return; }

            const btn = document.getElementById('img-btn');
            const loading = document.getElementById('img-loading');
            const imgEl = document.getElementById('generated-img');

            btn.innerText = "GENERATING...";
            loading.style.display = 'block';
            imgEl.style.display = 'none';

            // Clean the prompt for URL
            const safePrompt = encodeURIComponent(prompt);
            const randomSeed = Math.floor(Math.random() * 100000);
            
            // Real API Call
            const imgUrl = `https://image.pollinations.ai/prompt/${safePrompt}?seed=${randomSeed}&width=512&height=512&nologo=true`;

            imgEl.onload = function() {
                loading.style.display = 'none';
                imgEl.style.display = 'block';
                btn.innerText = "GENERATE ART 🖼️";
            };

            imgEl.src = imgUrl;
        }
    </script>
</body>
</html>
