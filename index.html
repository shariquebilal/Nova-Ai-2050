<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Cloner</title>
    <!-- FFmpeg library load kar rahe hain -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 40px 20px; margin: 0; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0px 8px 20px rgba(0,0,0,0.5); max-width: 500px; margin: auto; border: 1px solid #333; }
        h1 { color: #00d2ff; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 25px; }
        .upload-box { border: 2px dashed #00d2ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #252525; }
        input[type="file"] { color: #fff; width: 100%; }
        .process-btn { background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .process-btn:hover { opacity: 0.9; transform: scale(0.98); }
        .status-msg { margin-top: 20px; font-size: 14px; color: #f39c12; font-weight: bold; }
        .download-btn { display: none; background: #27ae60; color: white; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
        .download-btn:hover { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Cloner Tool</h1>
        <p>Apne video ko unique banayein (Flip & Speed modify)</p>
        
        <div class="upload-box">
            <input type="file" id="videoUpload" accept="video/mp4,video/x-m4v,video/*">
        </div>

        <button class="process-btn" id="startBtn" onclick="processVideo()">Clone Video Now</button>
        
        <div id="status" class="status-msg"></div>
        
        <a id="downloadLink" class="download-btn">⬇️ Download Modified Video</a>
    </div>

    <script>
        // FFmpeg setup
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        async function processVideo() {
            const fileInput = document.getElementById('videoUpload');
            const statusText = document.getElementById('status');
            const downloadLink = document.getElementById('downloadLink');
            const startBtn = document.getElementById('startBtn');

            if (fileInput.files.length === 0) {
                alert("Bhai, pehle ek video upload toh karo!");
                return;
            }

            const file = fileInput.files[0];
            startBtn.disabled = true;
            startBtn.innerText = "Processing...";
            downloadLink.style.display = 'none';

            try {
                // Load FFmpeg engine
                statusText.innerText = "Processing Engine Load ho raha hai (Isme 1-2 minute lag sakte hain)...";
                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                // File ko browser ki memory mein read karna
                statusText.innerText = "Video read ho raha hai...";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                // Video ko Flip karna (hflip) aur speed thodi change karna taaki copyright bypass ho sake
                statusText.innerText = "Video modify ho raha hai. Kripya wait karein...";
                await ffmpeg.run('-i', 'input.mp4', '-vf', 'hflip,setpts=0.95*PTS', '-af', 'atempo=1.05', 'output.mp4');

                // Output file ko bahar nikalna
                statusText.innerText = "Video Ready ho gaya!";
                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

                // Download link set karna
                downloadLink.href = videoUrl;
                downloadLink.download = 'cloned_' + file.name;
                downloadLink.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusText.innerText = "Kuch error aa gaya. Browser support nahi kar raha shayad.";
            } finally {
                startBtn.disabled = false;
                startBtn.innerText = "Clone Video Now";
            }
        }
    </script>
</body>
</html>
