<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI 2050 - Creator Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #02030A;
            --neon-cyan: #00E5FF;
            --electric-purple: #8A2EFF;
            --text-main: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 229, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(138, 46, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.15), transparent 25%);
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: transparent url('https://cdn.pixabay.com/photo/2016/01/27/15/25/space-1164579_960_720.png') repeat top center;
            animation: move-stars 200s linear infinite; opacity: 0.3;
        }

        @keyframes move-stars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        .header { text-align: center; margin-top: 40px; z-index: 10; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px var(--neon-cyan); text-transform: uppercase; }
        .header p { font-size: 12px; color: var(--neon-cyan); letter-spacing: 2px; margin-top: 5px; text-transform: uppercase; }

        /* Dashboard View */
        #dashboard-view { display: block; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .orb-container { position: relative; width: 200px; height: 200px; margin: 30px auto; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .core-orb { width: 80px; height: 80px; background: radial-gradient(circle, #fff, var(--neon-cyan)); border-radius: 50%; box-shadow: 0 0 50px var(--neon-cyan); animation: pulse 3s infinite alternate; }
        .ring { position: absolute; width: 180px; height: 180px; border-radius: 50%; border-top: 2px solid var(--neon-cyan); border-bottom: 2px solid var(--electric-purple); animation: spin 4s linear infinite; }
        .ring-2 { width: 220px; height: 220px; border-radius: 50%; border-left: 2px solid var(--neon-cyan); border-right: 2px solid var(--electric-purple); animation: spin-reverse 6s linear infinite; }

        @keyframes pulse { 100% { transform: scale(1.1); box-shadow: 0 0 70px var(--neon-cyan), 0 0 120px var(--electric-purple); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 90%; max-width: 600px; z-index: 10; padding-bottom: 120px; }
        .holo-card { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 15px; padding: 20px; text-align: center; transition: 0.3s; cursor: pointer; }
        .holo-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 229, 255, 0.2); transform: translateY(-5px); }
        .holo-card h3 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--neon-cyan); margin-bottom: 5px; }
        .holo-card p { font-size: 11px; color: rgba(255, 255, 255, 0.6); }

        /* Tool Panel View */
        #tool-view { display: none; width: 90%; max-width: 500px; margin-top: 30px; z-index: 10; background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--neon-cyan); border-radius: 20px; padding: 30px; box-shadow: 0 0 40px rgba(0, 229, 255, 0.1); text-align: center; }
        .tool-title { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 20px; margin-bottom: 20px; letter-spacing: 2px; }
        .input-box { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--glass-border); border-radius: 10px; padding: 15px; color: white; font-size: 14px; margin-bottom: 20px; outline: none; }
        .input-box:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        
        .action-btn { background: linear-gradient(45deg, var(--neon-cyan), #0077ff); border: none; color: #000; font-weight: bold; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); margin-bottom: 15px; }
        .back-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { border-color: white; }

        /* Widget Container */
        #download-widget { margin-top: 15px; width: 100%; min-height: 80px; border-radius: 10px; overflow: hidden; display: none; background: rgba(0,0,0,0.4); border: 1px dashed var(--neon-cyan); padding: 10px; }

        .dock { position: fixed; bottom: 30px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 40px; padding: 15px 30px; display: flex; gap: 30px; z-index: 100; }
        .dock-item { color: rgba(255, 255, 255, 0.5); font-size: 20px; text-align: center; cursor: pointer; }
        .dock-item.active { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); transform: scale(1.2); }
        .dock-item span { display: block; font-family: 'Inter', sans-serif; font-size: 9px; margin-top: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="header">
        <h1>NOVA AI</h1>
        <p>Create Beyond Imagination</p>
    </div>

    <div id="dashboard-view">
        <div class="orb-container">
            <div class="core-orb"></div>
            <div class="ring"></div>
            <div class="ring-2"></div>
        </div>

        <div class="features-grid">
            <div class="holo-card">
                <h3>🎬 AI STUDIO</h3>
                <p>Holographic Video Editor</p>
            </div>
            <div class="holo-card" onclick="openTool()">
                <h3>⚡ MEDIA EXTRACT</h3>
                <p>Bypass & Clone Assets</p>
            </div>
            <div class="holo-card">
                <h3>🎨 AI THUMBNAIL</h3>
                <p>Neural Image Generation</p>
            </div>
            <div class="holo-card">
                <h3>🎙️ AI VOICE</h3>
                <p>Neural Text-to-Speech</p>
            </div>
        </div>
    </div>

    <div id="tool-view">
        <h2 class="tool-title">⚡ ON-SITE EXTRACTOR</h2>
        <p style="color: #aaa; font-size: 12px; margin-bottom: 20px;">Direct Render, No Redirects</p>
        
        <input type="text" id="videoUrl" class="input-box" placeholder="Paste YouTube Link Here...">
        
        <button class="action-btn" onclick="extractMedia()">RENDER DOWNLOAD BUTTON</button>
        
        <div id="download-widget"></div>

        <button class="back-btn" style="margin-top: 15px;" onclick="goBack()">← Back to Dashboard</button>
    </div>

    <div class="dock">
        <div class="dock-item active">⌂<span>Home</span></div>
        <div class="dock-item">✦<span>Studio</span></div>
        <div class="dock-item">∞<span>Projects</span></div>
    </div>

    <script>
        function openTool() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('tool-view').style.display = 'block';
            document.getElementById('download-widget').style.display = 'none';
            document.getElementById('download-widget').innerHTML = '';
            document.getElementById('videoUrl').value = '';
        }

        function goBack() {
            document.getElementById('tool-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'flex';
        }

        function extractMedia() {
            const url = document.getElementById('videoUrl').value;
            const widgetBox = document.getElementById('download-widget');
            
            if(!url) {
                alert("Bhai, link toh paste karo!");
                return;
            }
            
            let videoId = "";
            if (url.includes("shorts/")) videoId = url.split("shorts/")[1].split("?")[0];
            else if (url.includes("v=")) videoId = url.split("v=")[1].split("&")[0];
            else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1].split("?")[0];

            if(!videoId) {
                alert("Invalid Link! YouTube ki sahi link daalo.");
                return;
            }

            // Instead of redirecting, we render a download button IFRAME securely inside our own page.
            widgetBox.style.display = 'block';
            widgetBox.innerHTML = `<h3 style="color:var(--neon-cyan); font-size:12px; margin-bottom:10px;">Select Quality to Download:</h3>
                                   <iframe src="https://api.vevioz.com/@api/button/mp4/${videoId}" width="100%" height="100px" scrolling="no" style="border:none; border-radius: 8px;"></iframe>`;
        }
    </script>
</body>
</html>
